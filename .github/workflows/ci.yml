name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    name: Test & coverage (artemis-lander)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artemis-lander
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: Show Node version
        run: node --version

      # The test suite uses Node's built-in test runner and built-in coverage.
      # No dependencies are installed, so there is no registry/network step.
      - name: Run tests with coverage (fails under 80% lines / 80% funcs / 70% branches)
        run: npm test
